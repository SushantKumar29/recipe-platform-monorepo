services:
  postgres:
    image: postgres:16
    container_name: recipe_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recipe_platform_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: recipe-platform-backend/Dockerfile
    container_name: recipe_backend
    restart: always
    depends_on:
      - postgres
    environment:
      NODE_ENV: production
      PG_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/recipe_platform_db
    env_file:
      - ./recipe-platform-backend/.env
    ports:
      - "3000:3000"

volumes:
  postgres_data:

